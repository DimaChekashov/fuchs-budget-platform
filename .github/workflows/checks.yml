name: Platform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WALLET_TEST_DATABASE_URL: postgres://fuchs:secret@localhost:5434/wallet_db?sslmode=disable
      LEDGER_TEST_DATABASE_URL: postgres://fuchs:secret@localhost:5435/ledger_db?sslmode=disable
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.work
          cache-dependency-path: |
            backend/go.work.sum
            backend/services/*/go.sum
            backend/pkg/*/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start PostgreSQL, Redis and Kafka
        run: |
          docker compose up -d --wait
          docker compose exec -T kafka kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists --topic wallet.operations.v1 --partitions 3 --replication-factor 1
      - name: Apply Goose migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.24.1
          goose -dir backend/services/identity-service/migrations postgres 'postgres://fuchs:secret@localhost:5433/identity_db?sslmode=disable' up
          goose -dir backend/services/wallet-service/migrations postgres "$WALLET_TEST_DATABASE_URL" up
          goose -dir backend/services/exchange-service/migrations postgres 'postgres://fuchs:secret@localhost:5436/exchange_db?sslmode=disable' up
          goose -dir backend/services/ledger-service/migrations postgres "$LEDGER_TEST_DATABASE_URL" up
      - name: Test Go modules
        run: go -C backend test -count=1 -timeout=90s ./services/identity-service/... ./services/wallet-service/... ./services/exchange-service/... ./services/ledger-service/... ./pkg/jwtmiddleware/...
      - name: Validate HTTP contracts and check compatibility
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.38.0
          for spec in docs/api/*/openapi.yaml; do
            oasdiff validate "$spec"
            base_spec="$spec"
            if ! git cat-file -e "$BASE_REF:$base_spec" 2>/dev/null; then
              service=$(basename "$(dirname "$spec")")
              base_spec="services/$service/api/openapi.yaml"
            fi
            if [[ -n "$BASE_REF" ]] && git cat-file -e "$BASE_REF:$base_spec" 2>/dev/null; then
              git show "$BASE_REF:$base_spec" > "$RUNNER_TEMP/base-openapi.yaml"
              oasdiff breaking --fail-on ERR "$RUNNER_TEMP/base-openapi.yaml" "$spec"
            fi
          done
      - name: Build web application and check generated types
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          git diff --exit-code -- src/shared/api
          npm run build
          npm run typecheck
          npx playwright install --with-deps chromium
      - name: Test the running platform with Playwright
        env:
          JWT_SECRET: test-shared-secret
          EXCHANGE_SERVICE_URL: http://localhost:8083
        run: |
          go -C backend build -o "$RUNNER_TEMP/identity" ./services/identity-service
          go -C backend build -o "$RUNNER_TEMP/wallet" ./services/wallet-service
          go -C backend build -o "$RUNNER_TEMP/exchange" ./services/exchange-service
          go -C backend build -o "$RUNNER_TEMP/ledger" ./services/ledger-service
          go -C backend build -o "$RUNNER_TEMP/wallet-relay" ./services/wallet-service/cmd/wallet-relay
          DATABASE_URL='postgres://fuchs:secret@localhost:5433/identity_db?sslmode=disable' "$RUNNER_TEMP/identity" &
          identity=$!
          DATABASE_URL="$WALLET_TEST_DATABASE_URL" "$RUNNER_TEMP/wallet" &
          wallet=$!
          DATABASE_URL='postgres://fuchs:secret@localhost:5436/exchange_db?sslmode=disable' "$RUNNER_TEMP/exchange" &
          exchange=$!
          DATABASE_URL="$LEDGER_TEST_DATABASE_URL" "$RUNNER_TEMP/ledger" &
          ledger=$!
          DATABASE_URL="$WALLET_TEST_DATABASE_URL" "$RUNNER_TEMP/wallet-relay" &
          relay=$!
          trap 'kill "$identity" "$wallet" "$exchange" "$ledger" "$relay" 2>/dev/null || true' EXIT
          for port in 8080 8082 8083; do
            curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent "http://localhost:$port/health"
          done
          npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
