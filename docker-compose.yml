x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 2s
  timeout: 3s
  retries: 20

services:
  postgres-identity:
    image: postgres:16-alpine
    healthcheck: *postgres-healthcheck
    environment:
      POSTGRES_USER: fuchs
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: identity_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data

  postgres-wallet:
    image: postgres:16-alpine
    healthcheck: *postgres-healthcheck
    environment:
      POSTGRES_USER: fuchs
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: wallet_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data

  postgres-ledger:
    image: postgres:16-alpine
    healthcheck: *postgres-healthcheck
    environment:
      POSTGRES_USER: fuchs
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ledger_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_ledger_data:/var/lib/postgresql/data

  postgres-exchange:
    image: postgres:16-alpine
    healthcheck: *postgres-healthcheck
    environment:
      POSTGRES_USER: fuchs
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: exchange_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_exchange_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 20
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_identity_data:
  postgres_wallet_data:
  postgres_ledger_data:
  postgres_exchange_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
